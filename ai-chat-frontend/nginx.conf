# 静态资源 + /api 反向代理，等价于 vite.config.ts 里的 dev proxy。
# 前端与接口同源于本容器，后端不需要配 CORS。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/xxx 转发成后端的 /xxx（剥掉 /api 前缀），与 dev proxy 的 rewrite 一致
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 回答是 SSE 流，缓冲会把整段回复憋到结束才发出，长回答还会被超时掐断
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        send_timeout 1h;
    }

    # 文件名带内容哈希，可以无限期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 入口页不能被缓存，否则改版后旧页面会去引用已经删掉的 chunk
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 路由：未知路径回落 index.html，交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
